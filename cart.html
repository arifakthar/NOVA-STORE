```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA STORE | Cart</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .cart-page {
            min-height: 80vh;
            padding: 100px 7%;
        }

        .cart-container {
            max-width: 1000px;
            margin: auto;
        }

        .cart-title {
            margin-bottom: 35px;
        }

        .cart-title span {
            color: #8b5cf6;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .cart-title h1 {
            font-size: 48px;
            margin-top: 10px;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            align-items: center;
            gap: 25px;
            padding: 22px;
            margin-bottom: 15px;
            border-radius: 18px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .cart-item-info h3 {
            margin-bottom: 7px;
        }

        .cart-item-info p {
            opacity: 0.6;
            font-size: 14px;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .quantity button {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 9px;
            background: #8b5cf6;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .quantity span {
            min-width: 25px;
            text-align: center;
        }

        .item-total {
            font-weight: 700;
        }

        .remove-btn {
            border: none;
            background: transparent;
            color: #ef4444;
            cursor: pointer;
        }

        .cart-summary {
            margin-top: 30px;
            padding: 28px;
            border-radius: 20px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 22px;
        }

        .empty-cart {
            text-align: center;
            padding: 70px 20px;
            opacity: 0.7;
        }

        .empty-cart h2 {
            margin-bottom: 10px;
        }

        .checkout-btn {
            width: 100%;
        }

        @media (max-width: 700px) {

            .cart-page {
                padding: 60px 20px;
            }

            .cart-title h1 {
                font-size: 36px;
            }

            .cart-item {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .total-row {
                font-size: 20px;
            }
        }
    </style>
</head>


<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <a href="index.html" class="logo">
            NOVA<span>.</span>
        </a>

        <div class="nav-actions">

            <button
                class="icon-btn"
                type="button"
                onclick="window.location.href='index.html'">

                ←

            </button>

        </div>

    </nav>


    <!-- CART -->

    <main class="cart-page">

        <div class="cart-container">

            <div class="cart-title">

                <span>
                    Your Shopping Bag
                </span>

                <h1>
                    Shopping Cart 🛒
                </h1>

            </div>


            <div id="cartItems"></div>


            <div
                id="cartSummary"
                class="cart-summary"
                style="display:none;">

                <div class="total-row">

                    <span>
                        Total
                    </span>

                    <span id="cartTotal">
                        ₹0
                    </span>

                </div>


                <button
                    class="primary-btn checkout-btn"
                    type="button"
                    onclick="checkout()">

                    Proceed to Checkout →

                </button>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        <div class="footer-logo">
            NOVA.
        </div>

        <p>
            © 2026 NOVA STORE. All rights reserved.
        </p>

    </footer>


    <!-- CART JAVASCRIPT -->

    <script>

        function displayCart() {

            const cart =
                JSON.parse(
                    localStorage.getItem("novaCart")
                ) || [];


            const cartItems =
                document.getElementById("cartItems");

            const cartSummary =
                document.getElementById("cartSummary");

            const cartTotal =
                document.getElementById("cartTotal");


            /* EMPTY CART */

            if (cart.length === 0) {

                cartItems.innerHTML = `

                    <div class="empty-cart">

                        <h2>
                            Your cart is empty 🛍️
                        </h2>

                        <p>
                            Add some products from NOVA STORE.
                        </p>

                        <button
                            class="primary-btn"
                            onclick="window.location.href='index.html'">

                            Continue Shopping

                        </button>

                    </div>

                `;

                cartSummary.style.display = "none";

                return;
            }


            /* CART HAS PRODUCTS */

            cartSummary.style.display = "block";


            let total = 0;


            cartItems.innerHTML = "";


            cart.forEach(function(product, index) {

                const price =
                    Number(product.price);

                const quantity =
                    Number(product.quantity);


                const itemTotal =
                    price * quantity;


                total += itemTotal;


                cartItems.innerHTML += `

                    <div class="cart-item">

                        <div class="cart-item-info">

                            <h3>
                                ${product.name}
                            </h3>

                            <p>
                                ₹${price.toLocaleString("en-IN")}
                                each
                            </p>

                        </div>


                        <div class="quantity">

                            <button
                                onclick="changeQuantity(${index}, -1)">

                                −

                            </button>

                            <span>
                                ${quantity}
                            </span>

                            <button
                                onclick="changeQuantity(${index}, 1)">

                                +

                            </button>

                        </div>


                        <div class="item-total">

                            ₹${itemTotal.toLocaleString("en-IN")}

                        </div>


                        <button
                            class="remove-btn"
                            onclick="removeItem(${index})">

                            Remove

                        </button>

                    </div>

                `;

            });


            cartTotal.textContent =
                "₹" +
                total.toLocaleString("en-IN");

        }


        /* CHANGE QUANTITY */

        function changeQuantity(index, amount) {

            const cart =
                JSON.parse(
                    localStorage.getItem("novaCart")
                ) || [];


            if (!cart[index]) return;


            cart[index].quantity =
                Number(cart[index].quantity) + amount;


            if (cart[index].quantity <= 0) {

                cart.splice(index, 1);

            }


            localStorage.setItem(
                "novaCart",
                JSON.stringify(cart)
            );


            displayCart();

        }


        /* REMOVE ITEM */

        function removeItem(index) {

            const cart =
                JSON.parse(
                    localStorage.getItem("novaCart")
                ) || [];


            cart.splice(index, 1);


            localStorage.setItem(
                "novaCart",
                JSON.stringify(cart)
            );


            displayCart();

        }


        /* CHECKOUT */

        function checkout() {

            alert(
                "Checkout feature coming soon 🚀"
            );

        }


        /* LOAD CART */

        displayCart();

    </script>

</body>

</html>
```
