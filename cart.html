<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NOVA | Shopping Cart</title>

<link rel="stylesheet" href="style.css">

<style>

    /* =================================
       CART PAGE
    ================================= */

    .cart-page {
        min-height: 80vh;
        padding: 80px 7%;
    }

    .cart-container {
        max-width: 950px;
        margin: auto;
    }


    /* =================================
       CART TITLE
    ================================= */

    .cart-title {
        margin-bottom: 40px;
    }

    .cart-title span {
        color: #8b5cf6;
        font-size: 13px;
        letter-spacing: 3px;
        text-transform: uppercase;
    }

    .cart-title h1 {
        font-size: 50px;
        margin-top: 10px;
    }


    /* =================================
       CART ITEM
    ================================= */

    .cart-item {
        display: grid;

        grid-template-columns:
            1fr auto auto auto;

        align-items: center;

        gap: 25px;

        padding: 22px;

        margin-bottom: 15px;

        border-radius: 18px;

        background:
            rgba(255,255,255,0.04);

        border:
            1px solid rgba(255,255,255,0.08);

        transition: 0.3s;
    }

    .cart-item:hover {
        transform: translateY(-3px);

        border-color:
            rgba(139,92,246,0.35);

        box-shadow:
            0 15px 35px rgba(0,0,0,0.2);
    }

    .cart-item-info h3 {
        margin-bottom: 7px;
        font-size: 18px;
    }

    .cart-item-info p {
        color: #888894;
        font-size: 13px;
    }


    /* =================================
       QUANTITY
    ================================= */

    .quantity {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .quantity button {
        width: 34px;
        height: 34px;

        border: none;
        border-radius: 9px;

        background: #8b5cf6;

        color: white;

        font-size: 18px;

        cursor: pointer;

        transition: 0.2s;
    }

    .quantity button:hover {
        transform: scale(1.08);

        box-shadow:
            0 5px 15px
            rgba(139,92,246,0.3);
    }


    /* =================================
       REMOVE
    ================================= */

    .remove-btn {
        border: none;

        background: transparent;

        color: #ef4444;

        cursor: pointer;

        font-size: 14px;

        transition: 0.2s;
    }

    .remove-btn:hover {
        color: #ff7777;

        transform: scale(1.05);
    }


    /* =================================
       SUMMARY
    ================================= */

    .cart-summary {
        margin-top: 30px;

        padding: 28px;

        border-radius: 20px;

        background:
            rgba(255,255,255,0.04);

        border:
            1px solid rgba(255,255,255,0.08);
    }

    .total-row {
        display: flex;

        justify-content: space-between;

        align-items: center;

        font-size: 22px;

        font-weight: 800;

        margin-bottom: 22px;
    }


    /* =================================
       EMPTY CART
    ================================= */

    .empty-cart {
        text-align: center;

        padding: 80px 20px;

        color: #888894;
    }

    .empty-cart h2 {
        color: white;

        margin-bottom: 10px;

        font-size: 28px;
    }

    .empty-cart p {
        margin-bottom: 25px;
    }


    /* =================================
       CHECKOUT BUTTON
    ================================= */

    .checkout-btn {
        width: 100%;
    }


    /* =================================
       CART TOAST
    ================================= */

    .cart-toast {
        position: fixed;

        right: 25px;
        bottom: 25px;

        z-index: 9999;

        display: flex;
        align-items: center;

        gap: 12px;

        padding: 14px 20px;

        border-radius: 14px;

        border:
            1px solid
            rgba(139,92,246,0.4);

        background:
            rgba(20,20,28,0.96);

        box-shadow:
            0 10px 35px
            rgba(0,0,0,0.35);

        opacity: 0;

        transform: translateY(30px);

        transition: 0.3s ease;
    }

    .cart-toast.show {
        opacity: 1;

        transform: translateY(0);
    }

    .cart-toast-icon {
        width: 28px;
        height: 28px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;

        background: #8b5cf6;

        color: white;

        font-weight: bold;
    }

    .cart-toast p {
        margin: 0;

        color: white;

        font-size: 14px;
    }


    /* =================================
       MOBILE
    ================================= */

    @media (max-width: 700px) {

        .cart-page {
            padding: 55px 20px;
        }

        .cart-title h1 {
            font-size: 38px;
        }

        .cart-item {

            grid-template-columns: 1fr;

            gap: 15px;

            align-items: flex-start;
        }

        .quantity {
            margin-top: 5px;
        }

        .cart-summary {
            padding: 22px;
        }

        .total-row {
            font-size: 20px;
        }

        .cart-toast {
            left: 20px;
            right: 20px;
            bottom: 20px;
        }

    }

</style>
```

<script>

    let cart =
        JSON.parse(
            localStorage.getItem("novaCart")
        ) || [];


    /* ================================
       DISPLAY CART
    ================================= */

    function displayCart() {

        const cartItems =
            document.getElementById(
                "cartItems"
            );

        const cartSummary =
            document.getElementById(
                "cartSummary"
            );

        const cartTotal =
            document.getElementById(
                "cartTotal"
            );


        /* EMPTY CART */

        if (cart.length === 0) {

            cartItems.innerHTML = `

                <div class="empty-cart">

                    <h2>
                        Your cart is empty 🛍️
                    </h2>

                    <p>
                        Add some products
                        from NOVA STORE.
                    </p>

                    <button
                        class="primary-btn"
                        onclick="
                            window.location.href='index.html'
                        ">

                        Continue Shopping

                    </button>

                </div>

            `;

            cartSummary.style.display =
                "none";

            return;
        }


        cartSummary.style.display =
            "block";
